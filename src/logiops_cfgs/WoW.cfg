devices: ({
  name: "MX Master 3 for Mac";
  smartshift: {
    on: true;
    threshold: 12;
  };
  hiresscroll: {
    hires: true;
    target: false;
  };
  dpi: 1200;
  buttons: ({
    cid: 0xc3;
    action = {
      type: "Gestures";
      gestures: ({
        direction: "Left";
        mode: "OnRelease";
        action = {
          type = "Keypress";
          keys: ["KEY_PREVIOUSSONG"];
        };
      }, {
        direction: "Right";
        mode: "OnRelease";
        action = {
          type = "Keypress";
          keys: ["KEY_NEXTSONG"];
        };
      }, {
        direction: "Down";
        mode: "OnInterval";
        interval: 20;
        action = {
          type: "Keypress";
          keys: ["KEY_VOLUMEDOWN"];
        };
      }, {
        direction: "Up";
        mode: "OnInterval";
        interval: 20;
        action = {
          type: "Keypress";
          keys: ["KEY_VOLUMEUP"];
        };
      }, {
        direction: "None";
        mode: "OnRelease";
        action = {
          type = "Keypress";
          keys: ["KEY_PLAYPAUSE"];
        };
      });
    };
  }, {
    cid: 0xc4;
    action = {
      type: "Keypress";
      keys: ["KEY_LEFTMETA", "KEY_W"];
    };
  });
}, {
